<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noon ERP · 系统原型 v1.1（PRD v1.0.3 / DDL v0.4 基线）</title>
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --subtle:#F8FAFC; --sidebar:#111A2E;
  --border:#E4E8EF; --border-strong:#CBD3E0;
  --t1:#1D2433; --t2:#5A6478; --t3:#8B95A7; --inv:#FFFFFF;
  --primary:#2B5CE6; --primary-weak:#EEF3FF; --accent:#FFC72C;
  --danger:#E5484D; --warning:#F5A524; --success:#16A34A; --info:#2B5CE6;
  --up:#D93025; --down:#0F9D58;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:4px; --r-md:8px; --r-lg:12px;
  --sh1:0 1px 2px rgba(17,26,46,.06); --sh2:0 8px 24px rgba(17,26,46,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:22px;color:var(--t1);background:var(--bg);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D6DCE6;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ AppShell ============ */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:224px;flex:0 0 224px;background:var(--sidebar);color:var(--inv);display:flex;flex-direction:column;transition:width .18s ease,flex-basis .18s ease;z-index:20}
#sidebar.collapsed{width:56px;flex-basis:56px}
.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.09);flex:0 0 56px}
.brand-mark{width:28px;height:28px;flex:0 0 28px;border-radius:7px;background:var(--accent);color:#111A2E;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:-1px}
.brand-txt{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand-sub{font-size:11px;color:#8FA0BE;font-weight:400;display:block;line-height:12px}
#sidebar.collapsed .brand-txt,#sidebar.collapsed .group-label,#sidebar.collapsed .nav-text,#sidebar.collapsed .nav-caret,#sidebar.collapsed .nav-badge{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:9px 0}
#nav{flex:1;overflow-y:auto;padding:10px 8px 24px}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
.group{margin-bottom:2px}
.group-label{font-size:11px;color:#7285A6;padding:12px 10px 5px;letter-spacing:.6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:6px;color:#B8C4D8;font-size:13px;text-align:left;position:relative;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-ico{width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:-.3px}
.nav-item.active .nav-ico{background:rgba(255,255,255,.22)}
.nav-text{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-caret{font-size:10px;opacity:.6}
.nav-badge{font-size:10px;background:var(--danger);color:#fff;border-radius:9px;padding:0 5px;line-height:16px}
.side-foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#7285A6;white-space:nowrap}
#sidebar.collapsed .side-foot{display:none}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:56px;flex:0 0 56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:10}
.crumb{font-size:12px;color:var(--t3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--t2);font-weight:600}
.top-search{display:flex;align-items:center;gap:7px;background:var(--subtle);border:1px solid var(--border);border-radius:var(--r-md);padding:5px 10px;width:224px;color:var(--t3);font-size:12px}
.top-search input{border:0;background:transparent;outline:none;width:100%;font-size:12px}
.seg{display:flex;background:var(--subtle);border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{padding:4px 10px;font-size:12px;border-radius:5px;color:var(--t2);white-space:nowrap}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}
.seg.plain button.on{background:var(--surface);color:var(--primary);box-shadow:var(--sh1)}
.top-select{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:5px 8px;font-size:12px;outline:none}
.proto-tag{font-size:10px;letter-spacing:.5px;color:#7A5B00;background:#FFF4CC;border:1px solid #F5DFA0;padding:3px 7px;border-radius:5px;white-space:nowrap;font-weight:600}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-weak);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

#content{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.wrap{max-width:1400px;margin:0 auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.page-head>div:first-child{min-width:0;flex:1}
.page-head h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.3px}
.page-desc{font-size:12px;color:var(--t3);margin-top:3px;max-width:820px;line-height:18px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;flex:none;padding-top:4px}
.page-actions .btn{white-space:nowrap}
.no-act{font-size:11px;line-height:1.6;color:var(--t3);max-width:340px;text-align:right;padding-top:6px}
.page-actions .no-act{flex:0 0 100%;max-width:none;padding-top:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fr-chip{display:inline-block;font-size:11px;color:var(--primary);background:var(--primary-weak);border-radius:4px;padding:1px 6px;margin-right:6px;font-weight:600;vertical-align:2px}

/* ============ Components ============ */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--r-md);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--t1);white-space:nowrap;transition:.14s}
.btn:hover{border-color:var(--border-strong);background:var(--subtle)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:#1E4BD0}
.btn.danger{color:var(--danger);border-color:#F5C7C9}
.btn.danger:hover{background:#FEF1F1}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-weak)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh1)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px;font-weight:600}
.card-h .sub{font-size:11px;color:var(--t3);font-weight:400;margin-left:8px}
.card-b{padding:16px}
.block{margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh1);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--sh2)}
.kpi .lab{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px}
.kpi .num{font-size:26px;line-height:34px;font-weight:650;letter-spacing:-.6px;margin:8px 0 4px}
.kpi .foot{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .delta.up{color:var(--up)} .kpi .delta.down{color:var(--down)}
.kpi.warn{border-left:3px solid var(--warning)} .kpi.danger{border-left:3px solid var(--danger)}
.kpi .corner{position:absolute;right:12px;top:12px;font-size:11px;color:var(--t3)}

.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:var(--r-md);font-size:12px;line-height:19px;margin-bottom:16px;border:1px solid}
.alert .ico{font-weight:800;font-size:13px;line-height:18px;flex:0 0 16px;text-align:center}
.alert.info{background:#F0F5FF;border-color:#CFE0FF;color:#1D4BA8}
.alert.warning{background:#FFF8E8;border-color:#F7DFAC;color:#8A5A00}
.alert.danger{background:#FEF1F1;border-color:#F6CCCE;color:#A82A2E}
.alert.success{background:#EFFAF3;border-color:#C6EBD5;color:#137A3C}
.alert b{font-weight:700}
.alert .spacer{flex:1}

table{width:100%;border-collapse:collapse;font-size:13px}
th{height:40px;background:var(--subtle);color:var(--t2);font-size:12px;font-weight:600;text-align:left;padding:0 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
td{height:48px;padding:0 12px;border-bottom:1px solid #EFF2F6;color:var(--t1);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7FAFF}
tbody tr.danger-row{background:#FFF7F7}
tbody tr.danger-row:hover{background:#FEF0F0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--t2)}
td.date{font-size:12px;color:var(--t2);white-space:nowrap}
td.muted{color:var(--t3);font-size:12px}
.rtl{direction:rtl;text-align:right;font-family:"Noto Sans Arabic",Tahoma,sans-serif;unicode-bidi:isolate;display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tbl-scroll{overflow-x:auto}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;line-height:18px}
.tag.gray{background:#F1F5F9;color:#5A6478}
.tag.blue{background:#EEF3FF;color:#2B5CE6}
.tag.green{background:#EAF7EF;color:#148141}
.tag.red{background:#FDECEC;color:#C43539}
.tag.orange{background:#FFF4E2;color:#B26B00}
.tag.purple{background:#F3EDFF;color:#6C3BD1}
.tag.yellow{background:#FFF6D6;color:#8A6500}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}
.countdown{font-weight:700;font-variant-numeric:tabular-nums}
.countdown.hot{color:var(--danger)} .countdown.ok{color:var(--t2)}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--t3);border-top:1px solid var(--border)}
.tbl-foot .pages{display:flex;gap:4px}
.tbl-foot .pages button{border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:12px;color:var(--t2)}
.tbl-foot .pages button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.filterbar select,.filterbar input{border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;background:var(--surface);outline:none;height:30px}
.filterbar input{width:180px}
.filterbar .spacer{flex:1}
.filter-hint{font-size:11px;color:var(--primary);background:var(--primary-weak);padding:3px 8px;border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mini-kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12px}
.mini-kv dt{color:var(--t3);white-space:nowrap}
.mini-kv dd{color:var(--t1);font-weight:500;word-break:break-all}
.note{font-size:12px;color:var(--t2);line-height:19px;background:var(--subtle);border-left:3px solid var(--border-strong);padding:10px 12px;border-radius:0 6px 6px 0;margin-top:12px}
.note b{color:var(--t1)}
.code-block{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:17px;background:#0F1729;color:#C6D4EA;padding:12px;border-radius:8px;overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-all}

/* flow / stepper / charts */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow-node{flex:1;min-width:118px;background:var(--subtle);border:1px solid var(--border);padding:11px 12px;position:relative}
.flow-node:first-child{border-radius:8px 0 0 8px} .flow-node:last-child{border-radius:0 8px 8px 0}
.flow-node+.flow-node{border-left:0}
.flow-node .n{font-size:10px;color:var(--primary);font-weight:700}
.flow-node .t{font-size:12px;font-weight:600;margin-top:2px}
.flow-node .d{font-size:10px;color:var(--t3);margin-top:2px;line-height:15px}
.flow-node.hi{background:var(--primary-weak);border-color:#C7D8FF}
.stepper{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:4px 0 14px}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3)}
.step .bul{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--t3);background:var(--surface)}
.step.done .bul{background:var(--success);border-color:var(--success);color:#fff}
.step.cur .bul{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--primary-weak)}
.step.cur{color:var(--primary);font-weight:600}
.step.done{color:var(--t2)}
.step-line{width:26px;height:1.5px;background:var(--border-strong);margin:0 7px}
.step-line.done{background:var(--success)}
.bars{display:flex;align-items:flex-end;gap:16px;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--border)}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-pair{display:flex;gap:5px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bar{width:26px;border-radius:4px 4px 0 0;position:relative;min-height:4px}
.bar.ae{background:var(--primary)} .bar.sa{background:var(--accent)}
.bar-lbl{font-size:11px;color:var(--t3);white-space:nowrap}
.legend{display:flex;gap:16px;font-size:11px;color:var(--t2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:22px;background:#0F1729;color:#D8E4F5;padding:14px 16px;border-radius:8px;white-space:pre-wrap}
.formula .k{color:#FFC72C} .formula .c{color:#7FA6FF} .formula .m{color:#6FD39B}
.ai-card{border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;margin-bottom:10px;background:var(--surface)}
.ai-card.approved{border-color:#BFE6CD;background:#F6FCF8}
.ai-card.rejected{border-color:#F0D3D4;background:#FEF8F8;opacity:.75}
.ai-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ai-top .ttl{font-weight:600;font-size:13px;flex:1;min-width:180px}
.ai-ev{font-size:11px;color:var(--t2);background:var(--subtle);border-radius:5px;padding:7px 9px;margin:6px 0;line-height:17px}
.ai-acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.conf{font-size:11px;color:var(--t3)}
.channel-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.channel-row:last-child{border-bottom:0}
.ch-name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.ch-desc{font-size:11px;color:var(--t3);margin-top:2px}
.switch{width:38px;height:21px;border-radius:12px;background:var(--border-strong);position:relative;transition:.16s;flex:0 0 38px}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on::after{transform:translateX(17px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:9px 15px;font-size:13px;color:var(--t2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.rpt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rpt{border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;background:var(--surface);transition:.14s}
.rpt:hover{border-color:var(--primary);background:#FAFCFF}
.rpt .id{font-size:10px;color:var(--primary);font-weight:700;letter-spacing:.5px}
.rpt .nm{font-size:13px;font-weight:600;margin:4px 0 3px}
.rpt .ds{font-size:11px;color:var(--t3);line-height:17px}
.later{font-size:10px;color:var(--t3);border:1px dashed var(--border-strong);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:500}

/* drawer / toast / modal */
#mask{position:fixed;inset:0;background:rgba(17,26,46,.35);z-index:39;display:none}
#mask.show{display:block}
#drawer{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:92vw;background:var(--surface);z-index:40;box-shadow:var(--sh2);transform:translateX(100%);transition:transform .24s ease-out;display:flex;flex-direction:column}
#drawer.show{transform:translateX(0)}
.dr-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.dr-head h3{font-size:17px;font-weight:600;flex:1}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px}
.dr-sec{margin-bottom:20px}
.dr-sec h4{font-size:12px;color:var(--t3);font-weight:600;letter-spacing:.4px;margin-bottom:9px;text-transform:uppercase}
.dr-close{font-size:20px;color:var(--t3);line-height:20px;padding:2px 6px;border-radius:5px}
.dr-close:hover{background:var(--subtle);color:var(--t1)}
details.raw{border:1px solid var(--border);border-radius:8px;overflow:hidden}
details.raw summary{padding:9px 12px;background:var(--subtle);font-size:12px;color:var(--t2);cursor:pointer;font-weight:600}
details.raw .code-block{border-radius:0;max-height:190px}
#toast{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#111A2E;color:#fff;padding:11px 15px;border-radius:8px;font-size:13px;box-shadow:var(--sh2);animation:tin .2s ease-out;max-width:420px;line-height:19px}
.toast.ok{border-left:3px solid var(--success)} .toast.err{border-left:3px solid var(--danger)} .toast.info{border-left:3px solid var(--primary)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(17,26,46,.4)}
#modal.show{display:flex}
.modal-box{background:var(--surface);border-radius:12px;width:440px;max-width:92vw;padding:22px;box-shadow:var(--sh2)}
.modal-box h3{font-size:17px;margin-bottom:10px}
.modal-box p{font-size:13px;color:var(--t2);line-height:21px;margin-bottom:18px}
.modal-acts{display:flex;justify-content:flex-end;gap:8px}
#searchpop{position:absolute;top:50px;right:24px;width:330px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh2);z-index:30;display:none;max-height:380px;overflow-y:auto;padding:8px}
#searchpop.show{display:block}
.sp-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px}
.sp-item:hover{background:var(--primary-weak)}
.sp-item small{color:var(--t3);display:block;font-size:11px}
.sp-empty{padding:14px;color:var(--t3);font-size:12px;text-align:center}

@media(max-width:1280px){
  #sidebar{width:56px;flex-basis:56px}

<script>
/* ==========================================================================
   Noon ERP Prototype v1.1 — 内存数据联动演示，无外部依赖
   Source of truth: docs/noon-erp-prd-v1.0.md (v1.0.3) / docs/noon-erp-schema-v0.4.sql
   ★ 模拟边界：本原型全部数据在浏览器内存中模拟，不代表真实落库、真实平台
   调用或真实财务结果。按钮演示的是「业务规则与状态流转」，不是已完成业务。
   ========================================================================== */
const S = { page:'P-01', site:'ALL', role:'ADMIN', policy:'NONE', tab:'ai',
            channels:{API:true,CSV:true,WEBHOOK:true,MANUAL:true},
            asnSealed:false, asnSlot:false, poConfirmed:false, sugConfirmed:false,
            ai:{}, expensePartial:{}, recalcVer:'FV-2026.11-01', convertedPO:null,
            filters:{}, calcBatches:[], rowRegistry:{},
            skuAlloc:false  // 维度B：SKU 分摊开关，默认关（可选功能，需显式启用）；方法固定 REVENUE_SHARE
          };

/* ---------- DEMO：端到端内存数据模型（Codex C-6） ----------
   一条真实联动链：采购 100@¥10 → 部分到货 40 → 调拨/ASN 发 40 收 38 →
   妥投 10 → 退货 2(B级补偿¥6) → 周账单对账 → 利润三档。
   所有页面表格与详情从这里取数，筛选真实生效。 */
const DEMO = {
  step: 0,                       // 0..7 进度指针
  po:{ no:'PO-DEMO-0001', qty:100, price:10, status:'DRAFT', received:0, unreceived:100 },
  batches:[],                    // {no, wh, site, qty, unit, parent, state, received}
  moves:[],                      // 库存流水
  consumptions:[],               // COGS 消耗/红冲
  returns:[],
  statements:[],
  ledger:{},                     // wh -> {available,in_transit,reserved,unsellable}
  events:[],                     // 审计链
  reset(){ this.step=0; this.po={no:'PO-DEMO-0001',qty:100,price:10,status:'DRAFT',received:0,unreceived:100};
    this.batches=[]; this.moves=[]; this.consumptions=[]; this.returns=[];
    this.statements=[]; this.ledger={}; this.events=[];
    S.calcBatches=[]; S.poConfirmed=false; S.asnSealed=false; S.asnSlot=false;
    S.ai={}; S.expensePartial={}; S.policy='NONE'; S.skuAlloc=false; S.recalcVer='FV-2026.11-01'; },
  log(act,text){ this.events.unshift({at:'2026-11-17 '+String(22+this.step).padStart(2,'0')+':00:00',act,text}); },
  // 演示订单级 L1：收入(销售额−退款) − 平台费(赔偿只在 COMPENSATION 减一次) − 净COGS(含红冲与报废全额)
  orderProfit(){
    const st=this.statements[0]; if(!st)return null;
    const revenue=st.gross-st.refund;
    const platformFee=st.fee-st.comp;
    const cogs=this.consumptions.reduce((a,c)=>a+c.sign*c.amount,0);
    return {revenue,platformFee,cogs,comp:st.comp,l1:revenue-platformFee-cogs};
  }
};
// ===== 演示链实算口径（端到端 10 件订单，上面 DEMO 数据流）=====
// 演示订单级 L2 费用池：按全站静态示例 1/100 缩放，仅用于演示链闭环实算，可追溯到 10 件订单
const DEMO_L2_ITEMS={FREIGHT:48.2,CUSTOMS_DUTY:12.6,PACKAGING:6.8,FX_LOSS:3.42,CHANNEL_FEE:2.18,AD_SPEND:3.96};
const DEMO_L2_TOTAL=77.16;
function demoPartialSum(){return Object.keys(S.expensePartial).reduce((a,k)=>a+(S.expensePartial[k]?(DEMO_L2_ITEMS[k]||0):0),0);}
// 维度A：allocation_policy 只决定 SITE 行合并多少 L2；是否摊到 SKU 由维度B skuAlloc 独立控制
function demoAllocFor(policy){return policy==='NONE'?0:(policy==='FULL'?DEMO_L2_TOTAL:demoPartialSum());}

// ===== 全站 SITE 静态示例（PRD C-3 固定基线，非演示链产出，勿与上面相加）=====
const L2_POOL=7716.58, L1_BASE=78210;
const PARTIAL_ITEMS={FREIGHT:4820,CUSTOMS_DUTY:1260,PACKAGING:680,FX_LOSS:342.18,CHANNEL_FEE:218.4,AD_SPEND:396};
function partialSum(){return Object.keys(S.expensePartial).reduce((a,k)=>a+(S.expensePartial[k]?(PARTIAL_ITEMS[k]||0):0),0);}
function allocFor(policy){return policy==='NONE'?0:(policy==='FULL'?L2_POOL:partialSum());}

const MENU = [
 ['工作台','DA',[['P-01','概览']]],
 ['主数据','MD',[['P-02','SKU 档案'],['P-03','Partner SKU 映射'],['P-04','供应商与报价'],['P-05','仓与站点'],['P-06','系统参数']]],
 ['采购','PU',[['P-07','采购单'],['P-08','到货入库'],['P-09','FIFO 批次流水']]],
 ['库存','IV',[['P-10','四态台账'],['P-11','调拨'],['P-12','盘点'],['P-13','库存变动流水']]],
 ['物流','LG',[['P-14','ASN 登记'],['P-15','收货差异'],['P-16','头程费用']]],
 ['销售','SL',[['P-17','订单'],['P-18','退货与申诉时效'],['P-19','Offer 健康']]],
 ['财务','FI',[['P-20','周账单 WEEKLY'],['P-21','仓储账单 STORAGE'],['P-22','差异清单'],['P-23','回款登记'],['P-24','费用字典'],['P-25','L2 费用池'],['P-26','利润报表与重算']]],
 ['补货','RP',[['P-27','补货建议'],['P-28','大促系数'],['P-29','预警']]],
 ['报表','RT',[['P-30','报表中心']]],
 ['集成','IT',[['P-31','同步任务'],['P-32','API 日志'],['P-33','Webhook 事件'],['P-34','导出任务'],['P-35','环境配置']]],
 ['系统','SY',[['P-36','系统管理']]]
];

/* ---------- page action capability (design spec §5.1) ----------
   页头只放「本页真实存在的操作」，不再给 36 页套同一个三按钮模板。
   a = 主操作 [文案, 类型, RBAC, 提示]；null = 该页无新建/导入入口
       create 建 DRAFT 单据 / import 平台数据导入 / run 系统生成 DRAFT 建议 / blocked 权限未开通
   e = 是否允许导出本页结果集
   f = 表格筛选预设 doc / master / flow / lookup / none
   w = 无页级操作时显示的只读原因（评审时可见，避免看起来像漏做）
   依据：PRD FR-01~FR-15、A-01/A-04、N-22/N-24、O-07；与需求逐页对应。
*/
const PAGE_CAP={
 'P-01':{a:null,e:false,f:'flow',w:'概览看板：数据由下游单据汇总，只读'},
 'P-02':{a:['新建 SKU','create','ADMIN OPERATOR','新建后为 DRAFT，EN/AR 双语与 category_code 必填'],e:true,f:'master'},
 'P-03':{a:['新增映射','create','ADMIN OPERATOR','partner_sku 与 sku_id 一一对应，按站点隔离'],e:true,f:'master'},
 'P-04':{a:['新增供应商','create','PURCHASE ADMIN','报价按 effective_from 版本化，不覆盖历史'],e:true,f:'master'},
 'P-05':{a:null,e:false,f:'lookup',w:'仓清单来自 ListWarehouses 只读回读（N-22），不可手工新建'},
 'P-06':{a:null,e:false,f:'lookup',w:'系统参数在行内编辑并留版本，不提供新建页头入口'},
 'P-07':{a:['新建采购单','create','PURCHASE ADMIN','DRAFT → CONFIRMED 需校验明细与有效报价'],e:true,f:'doc'},
 'P-08':{a:['登记到货','create','WAREHOUSE ADMIN','收货生成 inv_batch 批次，FIFO 按 received_at 排序'],e:true,f:'doc'},
 'P-09':{a:null,e:true,f:'flow',w:'FIFO 批次与消耗流水由入库 / 出库驱动，禁止手工新增'},
 'P-10':{a:null,e:true,f:'master',w:'四态台账由单据过账生成，不允许直接改数量'},
 'P-11':{a:['新建调拨单','create','WAREHOUSE ADMIN','调拨双写 inv_stock_move，跨站点不合并'],e:true,f:'doc'},
 'P-12':{a:['新建盘点单','create','WAREHOUSE ADMIN','盈亏生成调整流水并留审计链'],e:true,f:'doc'},
 'P-13':{a:null,e:true,f:'flow',w:'库存变动流水为只读审计视图，不可新增'},
 'P-14':{a:['新建 ASN','create','WAREHOUSE ADMIN','DRAFT 不可约 Slot，必须先 SEALED（N-09）'],e:true,f:'doc'},
 'P-15':{a:null,e:true,f:'doc',w:'收货差异由 ASN 收货比对自动生成，不手工建单'},
 'P-16':{a:['登记头程费用','create','FINANCE ADMIN','费用进 L2 池，不摊入 SKU（Q8）'],e:true,f:'doc'},
 'P-17':{a:['导入订单 CSV','import','ADMIN OPERATOR','列头可配置；主表与行级数量一致性校验（FR-13.2）'],e:true,f:'doc'},
 'P-18':{a:['登记申诉','create','SERVICE FINANCE ADMIN','申诉窗口按场景覆盖，逾期平台不受理'],e:true,f:'doc'},
 'P-19':{a:null,e:true,f:'master',w:'Offer 健康由 GetProductOffers 只读回读，本版不刊登不调价'},
 'P-20':{a:['导入周账单 CSV','import','FINANCE ADMIN','导入后启动 15 天争议倒计时（FR-07.3）'],e:true,f:'doc'},
 'P-21':{a:['导入仓储账单 CSV','import','FINANCE ADMIN','月度仓储账单与周账单分开核对'],e:true,f:'doc'},
 'P-22':{a:null,e:false,f:'doc',w:'差异清单为对账结果集，专属「导出差异清单」在下方，页头不重复'},
 'P-23':{a:['登记回款','create','FINANCE ADMIN','回款与 statement 勾稽，写 Bank Transaction ID'],e:true,f:'doc'},
 'P-24':{a:['新增费率版本','create','FINANCE ADMIN','按类目 × 站点 × 履约 × 生效日版本化，支持重算'],e:true,f:'lookup'},
 'P-25':{a:['登记 L2 费用','create','FINANCE ADMIN','勾选 included_in_partial 决定 PARTIAL 口径'],e:true,f:'flow'},
 'P-26':{a:null,e:true,f:'flow',w:'利润由引擎计算，页面内「全量重算」按 RBAC 授权，页头不重复'},
 'P-27':{a:['运行补货计算','run','OPERATOR PURCHASE ADMIN','只生成 DRAFT 建议单，转单需人工复核'],e:true,f:'doc'},
 'P-28':{a:['新增大促系数','create','OPERATOR ADMIN','按站点生效，直接影响 suggested_qty'],e:false,f:'lookup'},
 'P-29':{a:null,e:true,f:'master',w:'预警由规则引擎生成，只读'},
 'P-30':{a:null,e:false,f:'lookup',w:'报表中心为目录页，导出在各报表内执行'},
 'P-31':{a:['立即同步','run','ADMIN OPERATOR','按四通道降级，失败进 int_sync_task 重试'],e:true,f:'flow'},
 'P-32':{a:null,e:true,f:'flow',w:'API 日志为只读审计视图，不可新增'},
 'P-33':{a:null,e:true,f:'flow',w:'Webhook 事件为平台推送，只读；无 FBN 订单事件（N-24）'},
 'P-34':{a:['新建导出任务','blocked','','O-07/O-09：12 个类别码仅发现层达成，创建与列头均未验证，不可自动创建'],e:true,f:'flow'},
 'P-35':{a:null,e:false,f:'none',w:'通道开关与凭据配置在下方卡片内，按 A-04 只读策略执行'},
 'P-36':{a:null,e:false,f:'none',w:'用户 / 权限 / 审计 / 模板均在下方 Tab 内操作，AI 建议只能复核'}
};
const FILTER_PRESETS={
 doc:   {fields:['period','status','kw'],kw:'搜索单号 / SKU / 名称'},
 master:{fields:['status','kw'],kw:'搜索编码 / 名称'},
 flow:  {fields:['period','kw'],kw:'搜索 SKU / 单号'},
 lookup:{fields:['kw'],kw:'搜索编码 / 名称'},
 none:  {fields:[]}
};

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=(k,t,l,w)=>({k,t,l,w:w||''});
const R=(cols,arr)=>arr.map(a=>{const o={};cols.forEach((c,i)=>o[c.k]=a[i]);return o;});
const T=(title,cols,data,opt)=>({type:'table',title,cols,rows:R(cols,data),opt:opt||{}});
const K=(lab,num,foot,opt)=>({lab,num,foot,opt:opt||{}});
const A=(tone,text)=>({type:'alert',tone,text});
const H=(html)=>({type:'html',html});
const kpis=(...items)=>({type:'kpis',items});

const STATUS_MAP=[
 [/DRAFT|IMPORTED|PENDING|待补|未匹配/, 'gray'],
 [/CONFIRMED|MATCHED|RECEIVED|CLOSED|APPROVED|DELIVERED|SUCCESS|已闭合|正常|ACTIVE|LIVE/, 'green'],
 [/PARTIAL|IN_TRANSIT|SEALED|SLOT_BOOKED|RUNNING|DISPUTED|处理中|在途|预警|待复核/, 'orange'],
 [/FAILED|DEAD|CANCELLED|REJECTED|RETURNED|逾期|不足|断货|ISSUE|异常/, 'red'],
 [/API|EXPORT|WEBHOOK|MANUAL/, 'blue']
];
function tagClass(v){const s=String(v||'');for(const [re,c] of STATUS_MAP){if(re.test(s))return c;}return 'blue';}
function tag(v,cls){return '<span class="tag '+(cls||tagClass(v))+'">'+esc(v)+'</span>';}
function channelTag(v){
  const m={API:['api','blue'],'EXPORT':['csv','gray'],CSV:['csv','gray'],WEBHOOK:['webhook','purple'],MANUAL:['manual','orange']};
  const x=m[v]||['csv','gray'];return '<span class="tag '+x[1]+'">'+esc(v)+'</span>';
}
function siteTag(v){
  if(v==='AE')return '<span class="tag blue">AE · AED</span>';
  if(v==='SA')return '<span class="tag yellow">SA · SAR</span>';
  return '<span class="tag gray">ALL</span>';
}
function countdown(v){
  const s=String(v); const n=parseInt(s,10);
  if(isNaN(n))return '<span class="countdown hot">'+esc(s)+'</span>';
  const hot=n<=3;
  return '<span class="countdown '+(hot?'hot':'ok')+'">'+esc(s)+(hot?' 天 · 紧急':' 天')+'</span>';
}
function pct(v){const s=String(v);const c=s.trim().startsWith('-')?'down':'up';return '<span style="color:var(--'+c+');font-weight:600">'+esc(s)+'</span>';}
function cell(c,r){
  const v=r[c.k];
  switch(c.t){
    case 'num': return '<td class="num">'+esc(v)+'</td>';
    case 'money': return '<td class="num">'+esc(v)+'</td>';
    case 'pct': return '<td class="num">'+pct(v)+'</td>';
    case 'code': return '<td class="code">'+esc(v)+'</td>';
    case 'date': return '<td class="date">'+esc(v)+'</td>';
    case 'muted': return '<td class="muted">'+esc(v)+'</td>';
    case 'status': return '<td>'+tag(v)+'</td>';
    case 'channel': return '<td>'+channelTag(v)+'</td>';
    case 'site': return '<td>'+siteTag(v)+'</td>';
    case 'countdown': return '<td>'+countdown(v)+'</td>';
    case 'rtl': return '<td><span class="rtl" dir="rtl">'+esc(v)+'</span></td>';
    case 'bool': return '<td>'+(v==='Y'||v===true||v==='是'?'<span class="tag green">是</span>':'<span class="tag gray">否</span>')+'</td>';
    case 'act': return '<td><button class="btn sm ghost" data-act="drawer" data-title="'+esc(r._t||'单据详情')+'">详情</button></td>';
    default: return '<td>'+esc(v)+'</td>';
  }
}
// 页头操作区：按 PAGE_CAP 逐页渲染，无操作页显示只读原因而不是空着或硬塞按钮
/* ---------- DEMO 联动引擎（C-6：内存演示，不落库） ---------- */
const DEMO_STEPS=[
 {k:'po',    t:'① 确认采购单',      d:'PO-DEMO-0001 · 100 件 × ¥10，DRAFT → CONFIRMED'},
 {k:'in',    t:'② 部分到货 40',     d:'生成实收批 BAT-001(40) 入 CN01；未到货 60 件仍是 PO 未收，不建库存批次、不计可用'},
 {k:'ship',  t:'③ 调拨/ASN 发运 40',d:'在途段 BAT-001-02(40)；四态 CN01 可用 0 / 在途 40；调拨不写 COGS'},
 {k:'recv',  t:'④ 目的仓收 38',     d:'在途批 CLOSED 且余额清 0；短少 2 记 TRANSFER_SHORT 可追溯；AE-FBN 可用 38'},
 {k:'sale',  t:'⑤ 妥投 10 件',      d:'FIFO 扣 BAT-001-03：COGS = 10 × ¥10 = ¥100；可用 38→28'},
 {k:'ret',   t:'⑥ 退货 2 件(B级报废)',d:'红冲 −¥20 + RETURN_LOSS ¥20(原成本全额) + 赔偿 ¥6 只走 COMPENSATION → 净损 ¥14；退款 ¥30；报废不回可售库存'},
 {k:'stmt',  t:'⑦ 周账单对账',      d:'10 件 × ¥15 = 毛收入 ¥150（非 1500）；退款 ¥30；COGS ¥100（非 94，不抵赔偿）；赔偿 ¥6 只在 PLATFORM_FEE 减项'},
 {k:'profit',t:'⑧ 利润三档计算',    d:'三档 L1 从本演示订单流水实算（可追溯账单与 COGS）；维度A 站点费用合并 ONLY，维度B SKU 分摊独立开关默认关'}
];
function demoStep(k){
  switch(k){
    case 'po': if(DEMO.step!==0)return; DEMO.po.status='CONFIRMED'; DEMO.po.unreceived=100; DEMO.log('CONFIRM_PO','100×¥10，供应商有效、报价在有效期内'); break;
    case 'in': if(DEMO.step!==1)return;
      // 只到货 40：生成实收批入 CN01；未到货 60 件仍为 PO 未收，不建批次、不进任何可用台账
      DEMO.batches=[{no:'BAT-001',wh:'CN01',site:'AE',qty:40,unit:10,parent:null,state:'OPEN',received:'2026-11-14 09:00'}];
      DEMO.po.received=40; DEMO.po.unreceived=60; DEMO.po.status='PARTIAL_RECEIVED';
      DEMO.ledger.CN01={available:40,in_transit:0,reserved:0,unsellable:0}; break;
    case 'ship': if(DEMO.step!==2)return;
      // 发运 40：从 BAT-001 拆出在途子批；父批留 0（已全数发运），CN01 可用转在途
      DEMO.batches[0].qty=0;
      DEMO.batches.push({no:'BAT-001-02',wh:'CN01',site:'AE',qty:40,unit:10,parent:'BAT-001',state:'IN_TRANSIT',received:'2026-11-14 09:00'});
      DEMO.ledger.CN01.available=0; DEMO.ledger.CN01.in_transit=40;
      DEMO.log('TRANSFER_OUT','40 件 CN01 → AE-FBN 在途段 BAT-001-02；仅动四态台账，不写消耗流水'); break;
    case 'recv': if(DEMO.step!==3)return;
      // 目的仓实收 38：在途批 CLOSED 且余额清 0（不再与目的仓 38 重复统计）；短少 2 单独可追溯
      DEMO.batches.push({no:'BAT-001-03',wh:'AE-FBN',site:'AE',qty:38,unit:10,parent:'BAT-001',state:'OPEN',received:'2026-11-15 10:00'});
      DEMO.batches[1].qty=0; DEMO.batches[1].state='CLOSED';
      DEMO.ledger.CN01.in_transit=0; DEMO.ledger['AE-FBN']={available:38,in_transit:0,reserved:0,unsellable:0};
      DEMO.moves.push({no:'MV-DEMO-004',type:'TRANSFER_SHORT',qty:-2,ref:'TRF-DEMO-001',note:'发40−收38=短少2；在途批余额清0，短少不进COGS，成本血缘仍指父批 BAT-001'}); break;
    case 'sale': if(DEMO.step!==4)return;
      DEMO.consumptions.push({no:'CON-DEMO-005',batch:'BAT-001-03',qty:10,unit:10,amount:100,sign:1,type:'SALE',reversal:null});
      DEMO.batches[2].qty=28; DEMO.ledger['AE-FBN'].available=28; break;
    case 'ret': if(DEMO.step!==5)return;
      DEMO.consumptions.push({no:'CON-DEMO-006',batch:'BAT-001-03',qty:2,unit:10,amount:20,sign:-1,type:'RETURN_REVERSAL',reversal:'CON-DEMO-005'});
      // C-2b：RETURN_LOSS 按原采购层成本全额 ¥20，赔偿 ¥6 只在 COMPENSATION 确认一次
      DEMO.consumptions.push({no:'CON-DEMO-007',batch:'BAT-001-03',qty:2,unit:10,amount:20,sign:1,type:'RETURN_LOSS',reversal:'CON-DEMO-005'});
      DEMO.returns.push({no:'RET-DEMO-006',qty:2,grade:'B',comp:6,refund:30,loss:20,net:14});
      // B 级报废不回可售：批次与台账保持 28，报废去向单独记 unsellable=2（不可售），不写库存增加
      DEMO.ledger['AE-FBN'].unsellable=2;
      DEMO.moves.push({no:'MV-DEMO-006',type:'RETURN_SCRAP',qty:2,ref:'RET-DEMO-006',note:'B 级报废 2 件转不可售，不回可售；成本已在 RETURN_LOSS 全额计损'}); break;
    case 'stmt': if(DEMO.step!==6)return;
      // 毛收入 = 10×¥15 = 150；退款 30；平台费 82.5 含赔偿减项 −6（赔偿唯一确认点）；COGS = 净流水 100−20+20 = 100
      DEMO.statements.push({no:'STMT-DEMO-W47',gross:150,fee:82.5,refund:30,comp:6,cogs:100,status:'MATCHED'}); break;
    case 'profit': if(DEMO.step!==7)return;
      // 闭环实算：三档的 L1 来自上方演示订单流水（orderProfit()），L2 用演示订单级费用池；
      // 每一档都能沿 calc_batch_no → 账单 → COGS 消耗流水追溯，不再用静态全站基线代替演示结果。
      // 维度A policy 决定 SITE 合并多少 L2；维度B SKU 分摊另由 S.skuAlloc 独立控制（默认关）。
      const op=DEMO.orderProfit();
      ['NONE','PARTIAL','FULL'].forEach((p,i)=>{const pool=demoAllocFor(p);
        S.calcBatches.push({no:'CB-DEMO-00'+(i+1),policy:p,pool,l1:op.l1,net:op.l1-pool,ver:S.recalcVer,
          src:'DEMO_CHAIN',skuAlloc:S.skuAlloc});}); break;
  }
  DEMO.step++; DEMO.log(k,DEMO_STEPS.find(x=>x.k===k).d); renderPage();
  toast('<b>'+DEMO_STEPS.find(x=>x.k===k).t+'</b> 已执行（内存演示，未落库）','ok');
}

P['P-09']={t:'FIFO 批次流水',c:'采购 / 批次成本',fr:'FR-04.2 / FR-04.3 · 核心',d:'按 received_at ASC, batch_id ASC 依次扣减；COGS 唯一来源是 inv_batch_consumption，禁止手工填、禁止移动加权。',b:[
 A('warning','<b>成本红线</b>：<code>inv_batch.unit_cost</code> 只含采购价。头程 / 关税 / 清关 / 包材 / 贴标进 <code>log_shipment_cost → fin_expense_pool</code>（P-16 / P-25），<b>不写入批次成本</b>（Q8）。'),
 H('<div class="grid2 block"><section class="card"><div class="card-h"><h3>FIFO 扣减示意 · SKU-1001</h3><span class="sub">卖出 2 件，跨两批</span></div><div class="card-b">'
  +'<div class="formula"><span class="c">// 批次队列（received_at ASC）</span>\n'
  +'<span class="k">BAT-20261102-001</span>  200 件 × ¥86.00  → 剩余 <span class="m">0</span>  \n'
  +'<span class="k">BAT-20261108-002</span>  300 件 × ¥92.50  → 剩余 <span class="m">148</span>\n'
  +'<span class="k">BAT-20261112-003</span>  150 件 × ¥89.00  → 剩余 <span class="m">150</span>\n\n'
  +'<span class="c">// 订单 SO-AE-20261113-0841 卖出 2 件</span>\n'
  +'<span class="k">COGS</span> = 2 × ¥86.00 = <span class="m">¥172.00</span>\n'
  +'<span class="c">// 仅 DELIVERED 触发；CANCELLED 不扣</span></div>'
  +'<div class="note">每扣一批写一条 <code>inv_batch_consumption</code>；删除消耗流水后订单 COGS 归零，利润重算随之变化（FR-04.3 验收）。</div></div></section>'
  +'<section class="card"><div class="card-h"><h3>退货：红冲 + 分级处置（C-2b）</h3></div><div class="card-b"><div class="formula"><span class="c">// 第一步（所有分级）：红冲原 SALE</span>\nREVERSAL  sign=<span class="k">-1</span>  → 原消耗层\nreversal_of_id = 原 consumption.id\n\n<span class="c">// A 级：资产转移，不产生损益</span>\n生成 <span class="k">新批次</span> 插队尾，unit_cost = 原成本\n\n<span class="c">// B / C 级：按原采购成本全额计损</span>\nRETURN_LOSS = <span class="k">原成本全额</span>（禁止扣赔偿）\n赔偿 30 → 只走 <span class="k">COMPENSATION</span>（platform_fee 减项，1次）\n\n<span class="c">// 验算：成本100/售价150/全退/赔30</span>\nL1 = 0 - (-30) - (100-100+100) = <span class="m">-70</span></div>'
  +'<div class="note"><b>防双计红线</b>：赔偿不得同时抵减 RETURN_LOSS 和计入 COMPENSATION；双计会把 −70 错算成 −40。</div></div></section></div>'),
 T('批次台账',cBATCH,BATCHES,{note:'<b>守恒校验</b>：Σ 批次 qty_remaining = 四态台账可用量 = 流水累计（按仓）。退货新批次已排在最末。'}),
 T('批次消耗流水（COGS 唯一来源）',cCONSUME,CONSUME,{sub:'点行可查看对应订单与原始报文'})
]};

/* ---------- dynamic blocks ---------- */
function stepperHTML(states,cur){
  const i=states.indexOf(cur);
  return states.map((s,j)=>{
    const cls=j<i?'done':(j===i?'cur':'');
    return (j?'<span class="step-line '+(j<=i?'done':'')+'"></span>':'')
      +'<span class="step '+cls+'"><span class="bul">'+(j<i?'v':j+1)+'</span>'+esc(s)+'</span>';
  }).join('');
}
function aiTabHTML(){
  const done=AI_ITEMS.filter(x=>S.ai[x.id]).length;
  return '<div class="block" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
   +'<span style="font-size:12px;color:var(--t2)">场景 <b>STATEMENT_RECON</b> · 取数 <code>v_ai_statement_open</code> + 账单行 + 本地订单（只读）· 已复核 '+done+' / '+AI_ITEMS.length+'</span>'
   +'<span class="spacer" style="flex:1"></span><button class="btn sm" data-act="exportDiff">导出差异清单</button></div>'
   +AI_ITEMS.map(x=>{

      +(DEMO.batches.length?DEMO.batches.map(b=>'<dt>'+esc(b.no)+'</dt><dd>'+esc(b.wh)+' · '+b.qty+' 件 · unit ¥'+b.unit+(b.parent?' · parent='+esc(b.parent):'')+'</dd>').join(''):'<dt>尚未执行到货</dt><dd>先在 P-01 执行步骤 ②</dd>')+'</div></div>'):'')
   +(demo?('<div class="dr-sec"><h4>COGS 消耗与红冲链</h4><div class="mini-kv">'
      +(DEMO.consumptions.length?DEMO.consumptions.map(c=>'<dt>'+esc(c.no)+'</dt><dd>'+esc(c.type)+' · sign='+c.sign+' · ¥'+c.amount+(c.reversal?' · reversal_of='+esc(c.reversal):'')+'</dd>').join(''):'<dt>尚未妥投</dt><dd>先在 P-01 执行步骤 ⑤</dd>')+'</div></div>'):'')
   +'<div class="dr-sec"><h4>审计链（内存演示）</h4><div style="font-size:12px;line-height:23px;color:var(--t2)">'
   +(DEMO.events.length?DEMO.events.map(e=>esc(e.at)+'　'+esc(e.act)+'　'+esc(e.text)).join('<br>'):'LOG-DEMO-000　初始化　2026-11-17 22:00:00')+'</div></div>';
  document.getElementById('mask').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){document.getElementById('mask').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
function confirmModal(title,text,onOK){
  document.getElementById('modalBox').innerHTML='<h3>'+esc(title)+'</h3><p>'+text+'</p><div class="modal-acts"><button class="btn" data-act="closeModal">取消</button><button class="btn primary" id="modalOK">确认</button></div>';
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalOK').onclick=()=>{document.getElementById('modal').classList.remove('show');onOK();};
}
function go(id){if(!P[id])return;S.page=id;location.hash=id;document.getElementById('searchpop').classList.remove('show');renderNav();renderPage();}

/* ---------- interactions ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const a=t.dataset.act;
  if(a==='go'){go(t.dataset.go);return;}
  if(a==='drawer'){openDrawer(t.dataset.title,t.dataset.table,t.dataset.idx);return;}
  if(a==='closeDrawer'){closeDrawer();return;}
  if(a==='closeModal'){document.getElementById('modal').classList.remove('show');return;}
  if(a==='export'){toast('已创建导出任务：<b>'+esc((P[S.page]||{}).t||'本页')+'</b> 当前筛选结果集（GMT+8 时间戳 + 操作人 + 列头映射版本），写 <code>int_export_job</code>','info');return;}
  if(a==='filter'){toast('筛选已应用：结果集按条件真实过滤（演示数据）','info');return;}
  if(a==='resetFilter'){const fk=t.dataset.fk;if(fk){S.filters[fk]={};renderPage();}toast('筛选条件已重置','info');return;}
  if(a==='demoStep'){demoStep(t.dataset.k);return;}
  if(a==='demoReset'){DEMO.reset();renderPage();toast('演示数据已重置','info');return;}
  if(a==='pageAct'){
    const k=t.dataset.kind,l=t.dataset.label,h=t.dataset.hint||'';
    const msg={
      create:'已创建 <b>'+esc(l)+'</b> 草稿 · 状态 <code>DRAFT</code>，写入 <code>sys_audit_log</code>。'+esc(h),
      import:'已进入导入向导：选择文件 → 列头映射（A-01 可配置）→ 校验 → 错误行进异常清单，不整批回滚（FR-13.2）。'+esc(h),
      run:'已提交计算任务：结果只写 <code>DRAFT</code> 建议单，须人工复核后才落单（FR-11.4）。'+esc(h)
    }[k];
    toast(msg||('原型演示：'+esc(l)),'info');return;
  }
  if(a==='confirmPO'){
    if(S.poConfirmed){toast('该采购单已确认','info');return;}
    confirmModal('确认采购单 PO-20261115-0001','校验：至少 1 行明细 + 供应商有效 + 报价在有效期内。<br>确认后状态从 <b>DRAFT → CONFIRMED</b>，并写入审计日志。',()=>{S.poConfirmed=true;renderPage();toast('已确认 · CONFIRMED，审计日志 LOG-000943 已写入');});
    return;
  }
  if(a==='sealAsn'){
    if(S.asnSealed){toast('ASN 已 SEALED','info');return;}
    S.asnSealed=true;renderPage();toast('已封箱 · SEALED，现在允许填写 slot_date');return;
  }
  if(a==='bookSlot'){
    if(!S.asnSealed){toast('<b>被拦截（FR-05.1 / N-09）</b>：DRAFT 状态不可约 Slot，必须先 SEALED','err');return;}
    if(S.asnSlot){toast('Slot 已预约：2026-11-18','info');return;}
    S.asnSlot=true;renderPage();toast('已预约 Slot · SLOT_BOOKED，slot_date = 2026-11-18');return;
  }
  if(a==='convertSug'){
    if(S.sugConfirmed){toast('该建议单已转单','info');return;}
    confirmModal('确认并转采购单','AI / 系统只写 <code>DRAFT</code>；本次由人工账号 <b>'+S.role+'</b> 复核，记录 <code>reviewed_by/at</code>，CONVERTED 后回写 <code>converted_doc_type/no</code>。',()=>{
      S.sugConfirmed=true;S.convertedPO='PO-20261115-0009';renderPage();toast('已生成采购单 PO-20261115-0009，source_ref_no 可反查');});
    return;
  }
  if(a==='recalc'){
    confirmModal('利润全量重算（生成新计算批次）','按当前 <code>formula_version</code> 与维度A 口径 <code>'+S.policy+'</code> 重算，<b>生成新 calc_batch_no</b>，三档快照并存、旧批次不覆盖。维度B SKU 分摊当前 <b>'+(S.skuAlloc?'开启':'关闭')+'</b>（独立开关，重算不改变它）。原始单据不变，输入写入 <code>calc_input_snapshot</code>。',()=>{
      const n=S.calcBatches.length+4;
      const no='CB-RECALC-'+String(n).padStart(3,'0');
      const op=DEMO.orderProfit(), chain=!!op;
      const pool=chain?demoAllocFor(S.policy):allocFor(S.policy);
      const l1=chain?op.l1:L1_BASE;
      S.calcBatches.push({no,policy:S.policy,pool,l1,net:l1-pool,ver:S.recalcVer,src:chain?'DEMO_CHAIN':'STATIC',skuAlloc:S.skuAlloc});
      S.recalcVer='FV-2026.11-'+String(n).padStart(2,'0');renderPage();toast('重算完成 · 新批次 '+no+'（'+S.policy+'，'+(chain?'演示链实算':'静态基线')+'，L2 计入 ¥'+pool.toLocaleString()+'），旧快照保留可比对');});
    return;
  }
  if(a==='skuAlloc'){
    S.skuAlloc=!S.skuAlloc;renderPage();
    toast('维度B SKU 分摊已'+(S.skuAlloc?'<b>启用</b>：SITE 行 L2 按 REVENUE_SHARE 分摊到 SKU（ΣSKU=SITE）':'<b>关闭</b>（默认）：L2 仅在 SITE 行合并，SKU 行净利=自身 L1'),S.skuAlloc?'ok':'info');return;
  }
  if(a==='exportDiff'){toast('差异清单已导出（含账单号 / 行号 / 金额 / 原始行 / 争议截止日），请在 Seller Lab 人工提交','ok');return;}
  if(a==='aiReview'){
    const id=t.dataset.id,d=t.dataset.d;
    if(d==='REJECTED'){confirmModal('驳回建议','驳回必须可填原因，并写 <code>sys_audit_log</code>。原型演示原因：「证据不足，需人工核对原始账单」。',()=>{S.ai[id]='REJECTED';renderPage();toast('已驳回 · REJECTED，账单行 matched 仍未改动');});}
    else{confirmModal('通过建议','通过后 <b>由核心系统</b>更新 <code>fin_statement_line.matched</code> 并回写 <code>converted_doc_no</code>；AI 不参与落单。<br>复核人：<b>'+S.role+'</b>。',()=>{S.ai[id]='APPROVED';renderPage();toast('已通过 · APPROVED，reviewed_by/at 已记录');});}
    return;
  }
  if(a==='policy'){
    if(S.policy===t.dataset.policy)return;
    S.policy=t.dataset.policy;renderPage();toast('利润口径切换为 <b>'+S.policy+'</b>，历史快照未被覆盖','info');return;
  }
  if(a==='partial'){return;}
  if(a==='channel'){
    const ch=t.dataset.ch;S.channels[ch]=!S.channels[ch];renderPage();
    toast(ch+' 通道已'+(S.channels[ch]?'开启':'关闭')+(ch==='API'&&!S.channels.API?' · CSV 通道仍可跑通完整闭环':''),S.channels[ch]?'ok':'info');return;
  }
});
document.addEventListener('change',e=>{
  if(e.target.dataset.act==='partial'){S.expensePartial[e.target.dataset.k]=e.target.checked;renderPage();return;}
  const f=e.target.dataset.filter,fk=e.target.dataset.fk;
  if(f&&fk){
    if(!S.filters[fk])S.filters[fk]={};
    S.filters[fk][f]=e.target.value;renderPage();
    toast('筛选已生效：'+f+' = '+esc(e.target.value)+'（内存演示）','info');
  }
});
document.getElementById('siteSeg').addEventListener('click',e=>{
  const b=e.target.closest('[data-site]');if(!b)return;
  S.site=b.dataset.site;
  document.querySelectorAll('#siteSeg button').forEach(x=>x.classList.toggle('on',x.dataset.site===S.site));
  renderPage();toast('站点过滤：'+S.site+(S.site==='ALL'?'（全部站点，跨站点金额已归一 CNY）':''),'info');
});
document.getElementById('roleSel').addEventListener('change',e=>{
  S.role=e.target.value;applyRole();
  toast('已切换角色 <b>'+S.role+'</b>：受 RBAC 控制的按钮已按权限矩阵显隐（非财务角色看不到「全量重算」）','info');
});
document.addEventListener('click',e=>{
  const b=e.target.closest('#sysTabs [data-tab]');if(!b)return;
  S.tab=b.dataset.tab;renderPage();
});
document.getElementById('collapseBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('collapsed'));
document.getElementById('mask').addEventListener('click',closeDrawer);
document.getElementById('protoTag').addEventListener('click',()=>{
  confirmModal('Noon ERP 系统原型 v1.1','按 <b>PRD v1.0.3 / DDL v0.4</b> 制作，覆盖 FR-14 全部 <b>11 组菜单 / 36 个页面</b>。<br>'
   +'设计系统与 Figma 落地规范见 <code>docs/noon-erp-prototype-design-v1.0.md</code>，token 见 <code>prototype/figma-tokens.json</code>。<br>'
   +'<b>模拟边界</b>：全部数据在浏览器内存中演示，不调用 API、不落库、不代表真实业务完成。<br>'
   +'Seller Lab 真实列头 / 仓编码 / 费率表按 A-01 未用推测补齐。',()=>{});
});
const searchInput=document.getElementById('searchInput'),sp=document.getElementById('searchpop');
function doSearch(q){
  q=q.trim().toLowerCase();
  const all=MENU.flatMap(g=>g[2].map(it=>({id:it[0],name:it[1],group:g[0]})));
  const r=q?all.filter(x=>(x.name+x.id+x.group).toLowerCase().includes(q)):all.slice(0,8);
  sp.innerHTML=r.length?r.map(x=>'<button class="sp-item" data-act="go" data-go="'+x.id+'">'+esc(x.name)+'<small>'+x.id+' · '+esc(x.group)+'</small></button>').join(''):'<div class="sp-empty">未找到匹配页面</div>';
  sp.classList.add('show');
}
searchInput.addEventListener('focus',()=>doSearch(searchInput.value));
searchInput.addEventListener('input',()=>doSearch(searchInput.value));
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchInput.focus();sp.classList.add('show');doSearch('');}
  if(e.key==='Escape'){closeDrawer();document.getElementById('modal').classList.remove('show');sp.classList.remove('show');}
});
document.addEventListener('click',e=>{if(!e.target.closest('#searchpop')&&!e.target.closest('#searchBox'))sp.classList.remove('show');});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(P[h]&&h!==S.page){S.page=h;renderNav();renderPage();}});

/* boot */
const boot=location.hash.slice(1);if(P[boot])S.page=boot;
renderNav();renderPage();
toast('原型已就绪 · 36 个页面可点击导航，试试 P-14 的 ASN 拦截、P-26 三档口径、P-35 通道降级','info');
</script>
</body>
